<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Malagueta app icon: a ripe red malagueta pepper in front of an unripe
    green one (the pepper is picked at every stage, so a bunch is mixed),
    on a warm charred background. Drawn by hand for this project.
    scripts/make-icons.mjs renders it to the webOS launcher sizes.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#4a1712"/>
      <stop offset="0.55" stop-color="#22090a"/>
      <stop offset="1" stop-color="#110506"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="0.45" stop-color="#e8261a"/>
      <stop offset="1" stop-color="#8f0a0a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#a6d95a"/>
      <stop offset="0.5" stop-color="#5aa93a"/>
      <stop offset="1" stop-color="#25611f"/>
    </linearGradient>
    <linearGradient id="calyx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb348"/>
      <stop offset="1" stop-color="#2c6a25"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Green pepper, behind and tilted the other way -->
  <g transform="translate(256 262) scale(0.92) translate(-256 -262)">
  <g transform="translate(-62 6) rotate(-26 285 290)">
    <path d="M268 152 C312 140 346 162 340 207 C333 292 290 372 215 440 C205 450 194 444 201 431 C249 362 262 282 250 207 C246 180 250 158 268 152 Z" fill="url(#green)"/>
    <path d="M300 150 C298 122 306 100 330 86" fill="none" stroke="#2f6e27" stroke-width="12" stroke-linecap="round"/>
    <path d="M250 174 C262 140 332 132 346 172 C332 162 320 168 307 161 C297 172 281 170 270 163 C262 172 256 176 250 174 Z" fill="#2c6a25"/>
    <path d="M268 194 C273 250 264 306 240 362" fill="none" stroke="url(#shine)" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Red pepper, in front -->
  <g transform="translate(24 0)">
    <path d="M268 152 C312 140 346 162 340 207 C333 292 290 372 215 440 C205 450 194 444 201 431 C249 362 262 282 250 207 C246 180 250 158 268 152 Z" fill="url(#red)"/>
    <path d="M300 150 C298 122 306 100 332 82" fill="none" stroke="#3d8a34" stroke-width="14" stroke-linecap="round"/>
    <path d="M250 174 C262 140 332 132 346 172 C332 162 320 168 307 161 C297 172 281 170 270 163 C262 172 256 176 250 174 Z" fill="url(#calyx)"/>
    <path d="M268 196 C273 252 264 308 240 364" fill="none" stroke="url(#shine)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="276" cy="186" r="5" fill="#fff" opacity="0.7"/>
  </g>
  </g>
</svg>
